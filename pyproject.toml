[project]
name = "phishshield"
version = "0.1.0"
description = "Research pipeline measuring phishing-detector robustness on a controlled LLM-generated phishing benchmark"
requires-python = ">=3.9"
dependencies = [
    "pandas>=2.0",
    "scikit-learn==1.6.1",  # pinned exact -- see requirements.txt's comment: the deployed model artifact is a version-specific pickle
    "beautifulsoup4>=4.12",
    "lxml>=4.9",
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "httpx>=0.27"]
llm = ["anthropic>=0.40", "python-dotenv>=1.0"]
gemini = ["google-genai>=0.3", "python-dotenv>=1.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
